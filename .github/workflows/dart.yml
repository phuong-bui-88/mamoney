name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Verify TOKEN_API exists
        run: |
          if [ -z "${{ secrets.TOKEN_API }}" ]; then
            echo "TOKEN_API missing"
            exit 1
          fi
          
      - name: Build iOS with dart-define
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --verbose \
            --dart-define=GITHUB_TOKEN=${{ secrets.TOKEN_API }}

      - run: mkdir Payload
        working-directory: build/ios/iphoneos

      - run: mv Runner.app/ Payload
        working-directory: build/ios/iphoneos

      - name: Zip output
        run: zip -qq -r -9 FlutterIpaExport.ipa Payload
        working-directory: build/ios/iphoneos

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/FlutterIpaExport.ipa
          tag: v2.4
          overwrite: true
          body: "This is v2.4 release"
