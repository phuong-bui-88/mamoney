name: Build Unsigned IPA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # For Flutter projects:
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      # 3. Install App Dependencies (Flutter & iOS CocoaPods)
      - name: Install Dependencies
        run: |
          flutter pub get
          flutter precache --ios
      
      - name: Build Unsigned App Bundle (Unsigned IPA)
        run: |
          flutter clean
          flutter build ios --release --no-codesign

      - name: Package into IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -qq -r -9 unsigned-app.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: build/ios/iphoneos/unsigned-app.ipa
